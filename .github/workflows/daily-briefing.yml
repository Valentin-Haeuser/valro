name: Tägliches Briefing

on:
  schedule:
    # 04:30 UTC = 06:30 Berliner Sommerzeit, 05:30 im Winter. Mo–Fr.
    - cron: '30 4 * * 1-5'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Thema erzwingen (sleep, productivity, body, economics, psychology, learning, environment, nutrition, time, relationships)'
        required: false
        type: string
      dry_run:
        description: 'Nur erzeugen, nicht verschicken'
        required: false
        type: boolean
        default: false

# Nötig, damit der Lauf History und Archiv zurückschreiben kann.
permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Briefing erzeugen und verschicken
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          # Über die Umgebung statt direkt in die Zeile: Sonst landet der
          # eingegebene Text wörtlich im Shell-Befehl und könnte ihn umbauen.
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$INPUT_TOPIC" ]; then ARGS="--topic $INPUT_TOPIC"; fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npm run briefing -- $ARGS

      - name: Archiv und History zurückschreiben
        if: success() && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain data archive)" ]; then
            echo "Nichts zu committen."
            exit 0
          fi
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data archive
          git commit -m "Briefing vom $(date -u +%Y-%m-%d)"
          # Bei parallelen Läufen kann der Branch weitergewandert sein.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
